MEMORY 
{
    ZEROPAGE: start=$0000,   size=$100,    type=rw, define=yes, file="";
    STACK:    start=$0100,   size=$400,    type=rw, define=yes, file="";
    DATA:     start=$020000, size=$010000, type=rw, define=yes, file="";
    HEADER:   start=$120000, size=$000010, type=rw, define=yes, file="basic.bin";
    CODE:     start=$120010, size=$007FF0, type=rw, define=yes, file="basic.bin";
}

SEGMENTS 
{
    ZEROPAGE: load=ZEROPAGE, type=zp;
    DATA:     load=DATA,     type=rw, align=$100;
    CODE:     load=CODE,     type=ro;
    HEADER:   load=HEADER,   type=ro;
    LIBDATA:  load=DATA,     type=rw, align=$100;
    LIBCODE:  load=CODE,     type=ro;
}
